<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<title>花札こいこい</title>
		<meta name="description" content="Go 製の花札こいこいゲーム（任天堂ルール準拠）。ターミナル UI をそのままブラウザで。"/>
		<script src="wasm_exec.js"></script>
		<link rel="stylesheet" href="termstyle.css">
		<style>
			html, body {
				background: #000;
				margin: 0;
				height: 100%;
				overflow: hidden;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
			}
			/* 全角文字を正確に半角2文字分の幅にする (tcell.js の .wide と対) */
			#terminal .wide {
				display: inline-block;
				width: 2ch;
			}
			#github-link {
				position: fixed;
				top: 12px;
				right: 12px;
				z-index: 10;
				opacity: 0.5;
				transition: opacity 0.2s;
			}
			#github-link:hover { opacity: 1; }
			#github-link svg { display: block; }
		</style>
	</head>
	<body>
		<a id="github-link" href="https://github.com/ngs/go-koikoi" target="_blank" rel="noopener" aria-label="GitHub: ngs/go-koikoi">
			<svg width="28" height="28" viewBox="0 0 16 16" fill="#fff" aria-hidden="true">
				<path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
			</svg>
		</a>
		<pre id="terminal"></pre>
		<script>
			// ウィンドウに収まる最大セル数を計算し、koikoiSetSize (wasm 側が
			// 公開) 経由で gocui.SetSize へ渡す。起動時のサイズも wasm 側が
			// 発火する resize イベントでこのリスナーから決まる。
			function terminalCells() {
				var term = document.getElementById("terminal");
				var r = term.getBoundingClientRect();
				// 現在のセル数は tcell.js の tcellTermSize() から取得する
				// (window への var 漏れに依存しない)
				var size = typeof tcellTermSize === "function" ? tcellTermSize() : [80, 24];
				var cols = size[0];
				var rows = size[1];
				if (!r.width || !r.height) {
					return [0, 0];
				}
				var cw = r.width / cols;
				var ch = r.height / rows;
				return [
					Math.max(20, Math.floor(window.innerWidth / cw)),
					Math.max(10, Math.floor(window.innerHeight / ch)),
				];
			}
			window.addEventListener("resize", function () {
				if (typeof window.koikoiSetSize === "function") {
					var cells = terminalCells();
					window.koikoiSetSize(cells[0], cells[1]);
				}
			});
		</script>
		<script src="tcell.js"></script>
	</body>
</html>
